[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytortoisegit"
version = "0.1.0"
description = "基于 PySide6 重写的 TortoiseGit 跨平台 Git 客户端"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.1",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
pytortoisegit = "pytortoisegit.cli:main"

[tool.setuptools.packages.find]
include = ["pytortoisegit*"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.coverage.run]
source = ["pytortoisegit"]
omit = [
    "pytortoisegit/__main__.py",
    "*/site-packages/*",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]